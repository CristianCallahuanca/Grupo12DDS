spring:
  application:
    name: agregador

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8200

agregador:
  cron: "0 0 */6 * * *"
  timeout:
    segundos: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
