spring:
  application:
    name: agregador

  datasource:
    url: jdbc:mysql://db-central:3306/metamapa_central?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
    username: metamapa
    password: metamapa_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8200

agregador:
  cron: "*/20 * * * * *"
  timeout:
    segundos: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
