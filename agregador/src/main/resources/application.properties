# ===== APPLICATION CONFIGURATION =====
spring.application.name=agregador

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:mysql://localhost:3306/central?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===== JPA / HIBERNATE CONFIGURATION =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# ===== SQL INITIALIZATION =====
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===== SPRING AOP CONFIGURATION =====
spring.aop.auto=true
spring.aop.proxy-target-class=true

# ===== ACTUATOR / METRICS CONFIGURATION =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.all=true

# ===== METRICS DISTRIBUTION =====
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s

# ===== METRICS TAGS =====
management.metrics.tags.servicio=agregador
management.metrics.tags.environment=${ENVIRONMENT:development}
management.metrics.tags.application=metamapa

# ===== SERVER CONFIGURATION =====
server.port=8200
server.tomcat.connection-timeout=30s
server.tomcat.max-connections=200
server.tomcat.max-http-form-post-size=10MB
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# ===== LOGGING CONFIGURATION =====
logging.level.root=INFO
logging.level.org.example.agregador=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/agregador.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===== CUSTOM METRICS CONFIGURATION =====
app.metrics.prefix=agregador
app.metrics.enabled=true

# ===== INTEGRATION CONFIGURATION =====
app.integration.timeout=30000
app.integration.max-retries=3
app.integration.retry-delay=5000