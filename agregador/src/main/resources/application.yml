spring:
  application:
    name: agregador
server:
  port: 8200
agregador:
  cron: "*/20 * * * * *"
  timeout:
    segundos: 30

logging:
  file:
    name: logs/agregador/agregador.log
  level:
    root: INFO
    org.example.metamapa: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
