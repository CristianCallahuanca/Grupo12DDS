version: '3.8'

services:
  # Servicios de monitoreo (ya los tienes)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - metamapa-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=123456
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - metamapa-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped
    networks:
      - metamapa-network

  # TUS SERVICIOS METAMAPA
  gestor:
    build: ./gestor  # O usa imagen si ya la tienes
    container_name: metamapa-gestor
    ports:
      - "8500:8500"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - metamapa-network
    restart: unless-stopped

  dinamica:
    build: ./dinamica
    container_name: metamapa-dinamica
    ports:
      - "8102:8102"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - metamapa-network
    restart: unless-stopped

  agregador:
    build: ./agregador
    container_name: metamapa-agregador
    ports:
      - "8200:8200"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - metamapa-network
    restart: unless-stopped

  estadisticas:
    build: ./estadisticas
    container_name: metamapa-estadisticas
    ports:
      - "8600:8600"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - metamapa-network
    restart: unless-stopped

  demo:
    build: ./demo
    container_name: metamapa-demo
    ports:
      - "8700:8700"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - metamapa-network
    restart: unless-stopped

  estatico:
    build: ./estatico
    container_name: metamapa-estatico
    ports:
      - "8101:8101"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - metamapa-network
    restart: unless-stopped

  metamapa:
    build: ./metamapa
    container_name: metamapa-metamapa
    ports:
      - "8103:8103"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - metamapa-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  metamapa-network:
    driver: bridge