services:
  db-central:
    image: mysql:8.0
    container_name: metamapa-db-central
    environment:
      MYSQL_DATABASE: metamapa_central
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: metamapa
      MYSQL_PASSWORD: metamapa_pass
    ports:
      - "3306:3306"
    volumes:
      - db-central-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    networks: [ metamapa-net ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 15

  agregador:
    build:
      context: .
      dockerfile: agregador/Dockerfile
    container_name: metamapa-agregador
    ports:
      - "8200:8200"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db-central:
        condition: service_healthy
    networks: [metamapa-net]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8200/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  gestor:
    build:
      context: .
      dockerfile: gestor-datos/Dockerfile
    container_name: metamapa-gestor
    ports:
      - "8500:8500"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db-central:
        condition: service_healthy
    networks: [ metamapa-net ]
    restart: unless-stopped

  estadisticas:
    build:
      context: .
      dockerfile: estadisticas/Dockerfile
    container_name: metamapa-estadisticas
    ports:
      - "8600:8600"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db-central:
        condition: service_healthy
    networks: [ metamapa-net ]
    restart: unless-stopped

  demo:
    build:
      context: .
      dockerfile: loader-demo/Dockerfile
    container_name: metamapa-demo
    ports:
      - "8700:8700"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db-central:
        condition: service_healthy
      agregador:
        condition: service_healthy
    networks: [ metamapa-net ]
    restart: unless-stopped

  dinamico:
    build:
      context: .
      dockerfile: loader-dinamico/Dockerfile
    container_name: metamapa-dinamico
    ports:
      - "8102:8102"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db-central:
        condition: service_healthy
      agregador:
        condition: service_healthy
    networks: [ metamapa-net ]
    restart: unless-stopped

  estatico:
    build:
      context: .
      dockerfile: loader-estatico/Dockerfile
    container_name: metamapa-estatico
    ports:
      - "8101:8101"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db-central:
        condition: service_healthy
      agregador:
        condition: service_healthy
    networks: [metamapa-net]
    restart: unless-stopped
    volumes:
      # acá montás la carpeta de CSVs (de tu PC) adentro del contenedor como /data
      - ./datos:/data:ro

  metamapa:
    build:
      context: .
      dockerfile: loader-metamapa/Dockerfile
    container_name: metamapa-metamapa
    ports:
      - "8103:8103"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db-central:
        condition: service_healthy
      agregador:
        condition: service_healthy
    networks: [metamapa-net]
    restart: unless-stopped

  getaway:
    build:
      context: .
      dockerfile: getaway/Dockerfile
    container_name: metamapa-getaway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - gestor
      - agregador
      - estadisticas
    networks: [metamapa-net]
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: metamapa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks: [metamapa-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: metamapa-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [metamapa-net]
    restart: unless-stopped

networks:
  metamapa-net:

volumes:
  db-central-data:
  prometheus-data:
  grafana-data:
