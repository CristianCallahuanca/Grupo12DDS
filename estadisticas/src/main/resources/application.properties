spring.application.name=central

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/central
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Configuracion de sincronizacion de entities contra la base de datos

# none: no toca la BD.
# validate: valida que las entidades coincidan con la BD.
# update: actualiza la BD seg?n las entidades (muy usado en desarrollo).
# create: crea las tablas en cada inicio.
# create-drop: igual que create pero borra al apagar.


spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ==== Prometheus ====
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.enable.all=true

# Asegurar que AOP funcione
spring.aop.auto=true
spring.aop.proxy-target-class=true

# Metricas especificas para CSV
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Tags comunes para todas las metricas
management.metrics.tags.servicio=estadisticas
management.metrics.tags.environment=${ENVIRONMENT:development}