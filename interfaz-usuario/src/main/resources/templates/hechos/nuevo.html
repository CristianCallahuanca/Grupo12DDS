<!DOCTYPE html>
<html th:replace="~{layout/base ::html}">
<div th:fragment="contenido" class="row">
  <div class="col-12 col-md-8 mx-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0"><i class="fas fa-bullhorn me-2"></i><span th:text="${titulo}">Reportar Nuevo Hecho</span></h1>
      <a th:href="@{/hechos}" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i>Volver</a>
    </div>

    <div class="card">
      <div class="card-body">
        <form th:action="@{/hechos/crear}" th:object="${hechoForm}" method="post" enctype="multipart/form-data">

          <div class="mb-3">
            <label for="titulo" class="form-label">Título <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="titulo" th:field="*{titulo}" placeholder="Ej: Colisión en Av. Corrientes" required>
            <div th:if="${#fields.hasErrors('titulo')}" class="text-danger small" th:errors="*{titulo}"></div>
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción <span class="text-danger">*</span></label>
            <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="4" placeholder="Describe lo que sucedió con el mayor detalle posible." required></textarea>
            <div th:if="${#fields.hasErrors('descripcion')}" class="text-danger small" th:errors="*{descripcion}"></div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="categoria" class="form-label">Categoría <span class="text-danger">*</span></label>
              <select class="form-select" id="categoria" th:field="*{categoria}" required>
                <option value="">Selecciona una categoría...</option>
                <option th:each="cat : ${listaCategorias}" th:value="${cat}" th:text="${cat}"></option>
                <option value="OTRA">Otra (especificar)</option>
              </select>
              <div th:if="${#fields.hasErrors('categoria')}" class="text-danger small" th:errors="*{categoria}"></div>
            </div>

            <div class="col-md-6 mb-3" id="otraCategoriaContainer" style="display: none;">
              <label for="categoriaOtra" class="form-label">Especifica la categoría <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="categoriaOtra" th:field="*{categoriaOtra}" placeholder="Ej: Obstrucción de la vía pública">
              <div th:if="${#fields.hasErrors('categoriaOtra')}" class="text-danger small" th:errors="*{categoriaOtra}"></div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="latitud" class="form-label">Latitud <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="latitud" th:field="*{latitud}" placeholder="-34.6037" required>
              <div th:if="${#fields.hasErrors('latitud')}" class="text-danger small" th:errors="*{latitud}"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="longitud" class="form-label">Longitud <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="longitud" th:field="*{longitud}" placeholder="-58.3816" required>
              <div th:if="${#fields.hasErrors('longitud')}" class="text-danger small" th:errors="*{longitud}"></div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="fechaAcontecimiento" class="form-label">Fecha y Hora del Acontecimiento <span class="text-danger">*</span></label>
              <input type="datetime-local" class="form-control" id="fechaAcontecimiento" th:field="*{fechaAcontecimiento}" required>
              <div th:if="${#fields.hasErrors('fechaAcontecimiento')}" class="text-danger small" th:errors="*{fechaAcontecimiento}"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="etiqueta" class="form-label">Etiqueta <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="etiqueta" th:field="*{etiqueta}" placeholder="Ej: URGENTE" required>
              <div th:if="${#fields.hasErrors('etiqueta')}" class="text-danger small" th:errors="*{etiqueta}"></div>
            </div>
          </div>

          <div class="mb-3">
            <label for="archivosMultimedia" class="form-label">Archivos Multimedia (Opcional)</label>
            <input type="file" class="form-control" id="archivosMultimedia" th:field="*{archivosMultimedia}" multiple>
          </div>

          <hr>
          <div class="d-flex justify-content-end">
            <a th:href="@{/hechos}" class="btn btn-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Reportar Hecho</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const categoriaSelect = document.getElementById('categoria');
      const otraCategoriaContainer = document.getElementById('otraCategoriaContainer');
      const otraCategoriaInput = document.getElementById('categoriaOtra');

      function toggleOtraCategoria() {
        if (categoriaSelect.value === 'OTRA') {
          otraCategoriaContainer.style.display = 'block';
          otraCategoriaInput.setAttribute('required', 'required');
        } else {
          otraCategoriaContainer.style.display = 'none';
          otraCategoriaInput.removeAttribute('required');
          otraCategoriaInput.value = ''; // Limpia el campo si se cambia la selección
        }
      }

      // Llama a la función al cargar la página (en caso de error de validación)
      toggleOtraCategoria();

      // Llama a la función cada vez que cambia la selección
      categoriaSelect.addEventListener('change', toggleOtraCategoria);
    });
  </script>
</div>
</html>
