<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo} + ' - MetaMapa'"></title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">

  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/mapa}">
      <i class="fa-solid fa-map"></i>
      MetaMapa
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/mapa}">Mapa</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/hechos/nuevo}">Reportar Hecho</a>
        </li>
        <li sec:authorize="hasAuthority('CREAR_SOLICITUD_ELIMINACION')" class="nav-item">
          <a class="nav-link" th:href="@{/solicitudes}">Mis Solicitudes</a>
        </li>
        <li sec:authorize="hasAuthority('CREAR_COLECCION')" class="nav-item">
          <a class="nav-link" th:href="@{/colecciones}">Colecciones</a>
        </li>
        <li class="nav-item">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-link nav-link" type="submit">Cerrar sesión</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-4 flex-grow-1">
  <div th:replace="~{::contenido}"></div>
</main>

<footer class="bg-dark text-light py-3 mt-auto">
  <div class="container text-center">
    <p class="mb-0">MetaMapa &copy; 2025</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
</body>
</html>
