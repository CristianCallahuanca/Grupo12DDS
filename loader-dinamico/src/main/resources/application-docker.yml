spring:
  application:
    name: loader-dinamico

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8102

loader:
  self:
    nombreFuente: "Fuente-Dinamica"
    tipo: "DINAMICA"
    baseUrl: "http://dinamico:8102/fuenteDinamica"
  registro:
    retryDelayMs: 10000

agregador:
  baseUrl: "http://agregador:8200"

app:
  upload:
    dir: /app/uploads-fuente-dinamica

cloudinary:
  cloud-name: dikwt4s3v
  api-key: 532288541159436
  api-secret: n-VZzSsyqy-eOu1CYyXUki9cjDc

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
