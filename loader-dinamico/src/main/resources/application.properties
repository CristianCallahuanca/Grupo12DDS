spring.application.name=loader_dinamico

# ==== BASE DE DATOS MYSQL LOCAL ====
spring.datasource.url=jdbc:mysql://localhost:3306/loader_dinamico?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== HIBERNATE / JPA ====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==== Prometheus ====
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.enable.all=true

# Asegurar que AOP funcione
spring.aop.auto=true
spring.aop.proxy-target-class=true

# Metricas especificas para CSV
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Tags comunes para todas las metricas
management.metrics.tags.servicio=loader-estatico
management.metrics.tags.environment=${ENVIRONMENT:development}

# Upload de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Directorio donde guardar fotos (relativo al proyecto)
app.upload.dir=./uploads-fuente-dinamica

