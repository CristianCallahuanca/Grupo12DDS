spring:
  application:
    name: loader-estatico

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8101

loader:
  self:
    id: "loader-estatico"
    nombreFuente: "Fuente-CSV"
    tipo: "ESTATICA"
    baseUrl: "http://estatico:8101/fuenteEstatica"
  registro:
    retryDelayMs: 10000

fileserver:
  tipo: local
  basePath: "/data"
  baseUrl: "http://gestor:8500/"

agregador:
  baseUrl: "http://agregador:8200"

logging:
  level:
    root: INFO
    org.example.metamapa: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
