# ===== APPLICATION CONFIGURATION =====
spring.application.name=loader-estatico

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:mysql://localhost:3306/loader_estatico?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===== JPA / HIBERNATE CONFIGURATION =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== SPRING AOP CONFIGURATION =====
spring.aop.auto=true
spring.aop.proxy-target-class=true

# ===== ACTUATOR / METRICS CONFIGURATION =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.all=true

# ===== METRICS DISTRIBUTION =====
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===== METRICS TAGS =====
management.metrics.tags.servicio=loader-estatico
management.metrics.tags.environment=${ENVIRONMENT:development}
management.metrics.tags.application=metamapa

# ===== SERVER CONFIGURATION =====
server.port=8101
server.tomcat.connection-timeout=30s
server.tomcat.max-connections=100

# ===== FILE UPLOAD CONFIGURATION =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=./tmp

# ===== CSV PROCESSING CONFIGURATION =====
app.csv.max-file-size=10MB
app.csv.allowed-extensions=csv,txt
app.csv.encoding=UTF-8
app.csv.delimiter=,
app.csv.quote-char="
app.csv.skip-lines=0
app.csv.validate-headers=true

# ===== GOOGLE DRIVE CONFIGURATION =====
app.google.drive.enabled=false
app.google.drive.folder-id=
app.google.drive.service-account-key-path=

# ===== LOGGING CONFIGURATION =====
logging.level.root=INFO
logging.level.org.example.loaderestatico=DEBUG
logging.file.name=logs/loader-estatico.log