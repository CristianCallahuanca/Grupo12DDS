spring:
  application:
    name: loader-metamapa

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8103

loader:
  id: "metamapa-joaco"
  self:
    nombreFuente: "Fuente-MetaMapa"
    tipo: "PROXY"
    baseUrl: "http://metamapa:8103/fuenteMetamapa"
  registro:
    retryDelayMs: 10000

agregador:
  baseUrl: "http://agregador:8200"

logging:
  level:
    root: INFO
    org.example.metamapa: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
