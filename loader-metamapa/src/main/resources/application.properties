# ===== APPLICATION CONFIGURATION =====
spring.application.name=loader-metamapa

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:mysql://localhost:3306/loader_metamapa?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===== JPA / HIBERNATE CONFIGURATION =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== SPRING AOP CONFIGURATION =====
spring.aop.auto=true
spring.aop.proxy-target-class=true

# ===== ACTUATOR / METRICS CONFIGURATION =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.all=true

# ===== METRICS DISTRIBUTION =====
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===== METRICS TAGS =====
management.metrics.tags.servicio=loader-metamapa
management.metrics.tags.environment=${ENVIRONMENT:development}
management.metrics.tags.application=metamapa

# ===== SERVER CONFIGURATION =====
server.port=8103
server.tomcat.connection-timeout=30s
server.tomcat.max-connections=100

# ===== LOADER CONFIGURATION =====
loader.id=metamapa-local
loader.self.nombreFuente=Fuente-MetaMapa
loader.self.tipo=PROXY
loader.self.baseUrl=http://localhost:8103/fuenteMetamapa
loader.registro.retryDelayMs=10000
loader.registro.maxRetries=3

# ===== AGGREGATOR CONFIGURATION =====
agregador.baseUrl=http://localhost:8200
agregador.timeout=30000
agregador.max-retries=3

# ===== LOGGING CONFIGURATION =====
logging.level.root=INFO
logging.level.org.example.loadermetamapa=DEBUG
logging.file.name=logs/loader-metamapa.log